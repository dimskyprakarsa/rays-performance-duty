<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RAYS PERFORMANCE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 border-rays bg-black/40 shadow-2xl">
        <div class="text-center mb-8">
            <img src="assets/logo.png" alt="Logo" class="w-40 mx-auto mb-4">
            <h2 class="text-xl font-black uppercase tracking-tighter">Create Account</h2>
        </div>
        <div class="space-y-4">
            <input type="text" id="regName" placeholder="Full Name" class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-xs outline-none focus:border-red-600 transition text-white">
            <input type="email" id="regEmail" placeholder="Email Address" class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-xs outline-none focus:border-red-600 transition text-white">
            <input type="password" id="regPassword" placeholder="Create Password" class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-xs outline-none focus:border-red-600 transition text-white">
            <button onclick="window.register()" class="w-full bg-white text-black hover:bg-gray-200 py-3 rounded-lg font-black text-[11px] uppercase tracking-widest transition active:scale-95">Register Now</button>
            <p class="text-center text-[10px] text-gray-500 uppercase">Already have an account? <a href="index.html" class="text-red-500 font-bold">Login</a></p>
        </div>
    </div>

    <script type="module">
        import firebaseConfig from "./config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.register = async () => {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if(!name || !email || !password) return alert("Please fill all fields");

            const newUserRef = push(ref(db, 'users'));
            await set(newUserRef, {
                name: name,
                email: email,
                password: password,
                grade: "Recruit",
                role: "user",
                totalHours: 0,
                weeklySalary: 0,
                onDuty: false
            });

            alert("Registration Success! Please Login.");
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
